# http -> https
server {
    listen 80;
    server_name pressovac-msk.ru www.pressovac-msk.ru;
    return 301 https://$host$request_uri;
}

# www -> без www
server {
    listen 443 ssl;
    server_name www.pressovac-msk.ru;
    ssl_certificate /etc/letsencrypt/live/pressovac-moscow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pressovac-moscow.ru/privkey.pem;
    return 301 https://pressovac-msk.ru$request_uri;
}

# основной
server {
    listen 443 ssl;
    server_name pressovac-msk.ru;
    ssl_certificate /etc/letsencrypt/live/pressovac-moscow.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pressovac-moscow.ru/privkey.pem;
    include /etc/nginx/snippets/junk-410.conf;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/pressovac;
    index index.html;

    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        resolver 8.8.8.8 ipv6=off valid=300s;
        set $supabase_upstream khuqrtjdnbjfmyasajrr.supabase.co;
        proxy_pass https://$supabase_upstream;
        proxy_set_header Host khuqrtjdnbjfmyasajrr.supabase.co;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_name khuqrtjdnbjfmyasajrr.supabase.co;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "authorization, x-client-info, apikey, content-type" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        client_max_body_size 20M;
    }

    location = / { try_files /index.html =404; }

    location / {
        include /etc/nginx/snippets/redirects.conf;
        try_files $uri $uri/ /index.html /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_comp_level 5;
}
