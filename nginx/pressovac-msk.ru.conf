server {
    listen 80;
    listen 443 ssl;
    http2 on;
    server_name pressovac-msk.ru www.pressovac-msk.ru
                pressovac-moscow.ru www.pressovac-moscow.ru;

    if ($host != "pressovac-msk.ru") {
        return 301 https://pressovac-msk.ru$request_uri;
    }

    location ^~ /component/search/ { return 410; }
    location ^~ /component/rsform/ { return 410; }
    location ^~ /component/mailto/ { return 410; }

    location / {
        if ($legacy_redirect != "") {
            return 301 https://pressovac-msk.ru$legacy_redirect;
        }
        try_files $uri $uri/ /index.html;
    }

    root /var/www/pressovac/dist;
    index index.html;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ~* \.(js|css|webp|png|jpg|jpeg|svg|woff2?|mp4)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location = /sitemap.xml { alias /var/www/pressovac/dist/sitemap.xml; }
    location = /robots.txt  { alias /var/www/pressovac/dist/robots.txt; }
}
