# /etc/nginx/snippets/redirects.conf
#
# Старые адреса сайта (Joomla) -> новые адреса.
# Подключается ВНУТРИ location / в файле /etc/nginx/sites-available/pressovac-msk.ru
#
# Контекст location допускает только rewrite и if/return.
# Директивы map, а также блоки server{} и location{} здесь работать НЕ будут.
#
# Синтаксис: ^/путь(/.*)?$  — совпадает и с самим путём, и с любым подпутём под ним.
# permanent = HTTP 301. Правила срабатывают по порядку, первое совпадение побеждает,
# поэтому длинные пути идут раньше коротких.


# --- Информационные страницы ---
rewrite ^/terms-of-delivery-and-payment(/.*)?$    /delivery permanent;
rewrite ^/politika-konfidentsialnosti(/.*)?$      /privacy permanent;
rewrite ^/demand-registration(/.*)?$              /inquiry permanent;
rewrite ^/training-materials-index(/.*)?$         /training permanent;
rewrite ^/educational-materials(/.*)?$            /training permanent;
rewrite ^/technical-information-v-2(/.*)?$        /technology permanent;
rewrite ^/technical-information-v2(/.*)?$         /technology permanent;
rewrite ^/basic-cleaning-concept(/.*)?$           /technology permanent;
rewrite ^/our-certificates-menu(/.*)?$            /about permanent;
rewrite ^/our-certificates(/.*)?$                 /about permanent;
rewrite ^/programma-dlya-partnerov(/.*)?$         /about permanent;
rewrite ^/program-for-partners(/.*)?$             /about permanent;
rewrite ^/return-call(/.*)?$                      /contacts permanent;
rewrite ^/contact(/.*)?$                          /contacts permanent;
rewrite ^/company(/.*)?$                          /about permanent;


# --- Каталог и оборудование ---
rewrite ^/decisions-on-complete-set-2018(/.*)?$   /catalog permanent;
rewrite ^/decisions-on-complete-set-2020(/.*)?$   /catalog permanent;
rewrite ^/videoinspection-diagnostics(/.*)?$      /catalog permanent;
rewrite ^/ductcleaning-equipment-v2(/.*)?$        /catalog permanent;
rewrite ^/decisions-on-complete-set(/.*)?$        /catalog permanent;
rewrite ^/ductcleaning-equipment(/.*)?$           /catalog permanent;
rewrite ^/disinfection-equipment(/.*)?$           /catalog permanent;
rewrite ^/compressor-equipment(/.*)?$             /catalog permanent;
rewrite ^/catalogue-pressovac(/.*)?$              /catalog permanent;
rewrite ^/gallery-video-index(/.*)?$              /catalog permanent;
rewrite ^/pdf-brochures-link(/.*)?$               /catalog permanent;
rewrite ^/urrent-promotions(/.*)?$                /catalog permanent;
rewrite ^/pdf-brochures(/.*)?$                    /catalog permanent;
rewrite ^/loan-programs(/.*)?$                    /catalog permanent;
rewrite ^/suction-unit(/.*)?$                     /catalog permanent;
rewrite ^/filter-units(/.*)?$                     /catalog permanent;
rewrite ^/accessories(/.*)?$                      /catalog permanent;
rewrite ^/actions-now(/.*)?$                      /catalog permanent;
rewrite ^/price-list(/.*)?$                       /catalog permanent;
rewrite ^/9-catalog(/.*)?$                        /catalog permanent;


# --- Магазин ---
rewrite ^/shop-online-menu-help2(/.*)?$           /store permanent;
rewrite ^/shop-online-menu-help(/.*)?$            /store permanent;
rewrite ^/shop-online-topmenu(/.*)?$              /store permanent;
rewrite ^/shop-online(/.*)?$                      /store permanent;


# --- Статьи и новости ---
rewrite ^/arcticles(/.*)?$                        /articles permanent;
rewrite ^/news(/.*)?$                             /articles permanent;


# --- Сознательно НЕ добавлено ---
# /images/*  — это медиафайлы (фото товаров, картинки). Их уже обрабатывает
#              /etc/nginx/snippets/junk-410.conf: всё кроме /images/products/
#              отдаётся с кодом 410. Правило на /catalog сломало бы картинки.
# /media/, /plugins/, /modules/, /administrator/, /cache/, /libraries/ и прочие
# служебные папки Joomla — тоже закрыты в junk-410.conf кодом 410.
# /index.php/* — закрыт там же кодом 410 (работает раньше этого файла,
#              так как regex-location имеет приоритет над location /).
